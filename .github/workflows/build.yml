name: build docker
on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  front-build:
    runs-on: ubuntu-latest
    steps:
        - name: checkout
          uses: actions/checkout@v6
        - run: |
            docker build -t ${{ github.sha }} ./back/

  back-build:
    needs: front-build
    runs-on: ubuntu-latest
    #if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
        - name: checkout
          uses: actions/checkout@v6
        - run: |
            docker build -t ${{ github.sha }} ./front/